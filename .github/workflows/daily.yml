name: 경매 알리미 (매일)

on:
  schedule:
    # 정각(00분)은 GitHub 서버가 붐벼 몇 시간씩 밀리므로 일부러 어긋난 시각으로 예약
    - cron: "17 22 * * *"  # 매일 07:17 KST (UTC 22:17)
  workflow_dispatch:        # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: normal
        options:
          - normal        # 새 물건만 알림
          - test-notify   # 알림 채널 테스트 메시지만 보냄
          - resend        # 이미 알린 물건도 포함해 조건에 맞는 물건 모두 다시 알림
      regions:
        description: "이번 실행에만 쓸 지역 (예: 대구, 부산 해운대구). 비우면 config.yaml 의 regions 사용"
        type: string
        required: false
        default: ""

permissions:
  contents: write           # 알림 기록(data/seen.json) 커밋용

concurrency:
  group: kyungmae
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04     # 10/19 ubuntu-latest 가 26으로 바뀌어도 영향 없도록 고정
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 경매 물건 조회 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'normal' }}
          REGIONS: ${{ inputs.regions }}
        run: |
          case "$MODE" in
            test-notify) python -m kyungmae -c config.yaml --test-notify ;;
            resend)      python -m kyungmae -c config.yaml --resend ;;
            *)           python -m kyungmae -c config.yaml ;;
          esac

      - name: 알림 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 알림 기록 갱신"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45*86400)) ]; then
            # 저장소에 60일간 커밋이 없으면 GitHub 가 예약 실행을 자동으로 끕니다.
            # 새 물건이 오래 없더라도 꺼지지 않도록 45일마다 빈 커밋을 남깁니다.
            git commit --allow-empty -m "chore: 예약 실행 유지 (keepalive)"
          else
            exit 0
          fi
          # 그사이 config.yaml 등을 고쳤어도 push 가 실패하지 않도록 최신 내용 위에 올림
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
